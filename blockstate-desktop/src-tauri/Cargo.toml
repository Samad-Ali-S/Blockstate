[package]
name = "blockstate"
version = "1.0.0"
description = "BlockState - Focus Enforcement System"
authors = ["BlockState Team"]
license = "MIT"
repository = "https://github.com/blockstate/blockstate"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "system-tray"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
env_logger = "0.11"

[features]
# This feature is used for production builds where `devPath` points to the filesystem
# and CORS is not needed
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
